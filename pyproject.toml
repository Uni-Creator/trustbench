[project]
name = "trustbench"
version = "0.2.0"
description = "TrustBench: Evaluation framework for ML model reliability, robustness, and uncertainty."
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Uni-Creator", email = "abhayr24564@gmail.com" }
]
requires-python = ">=3.11"
keywords = [
    "machine-learning",
    "evaluation",
    "reliability",
    "robustness",
    "uncertainty",
    "calibration",
    "ood-detection",
    "fairness",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Base dependencies: always installed
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "click>=8.1.0",
    "jinja2>=3.1.6",
    "pillow>=10.0.0",
]
[project.urls]
Homepage = "https://uni-creator.github.io/trustbench/"
Documentation = "https://uni-creator.github.io/trustbench/"
Repository = "https://github.com/Uni-Creator/trustbench"
Issues = "https://github.com/Uni-Creator/trustbench/issues"
Changelog = "https://github.com/Uni-Creator/trustbench/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# PyTorch inference
torch = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
]
pytorch = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
]
# Storage backend (SQLAlchemy / SQLite)
storage = [
    "sqlalchemy>=2.0.0",
]
# Optional REST API service
api = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.20.0",
]
# Reporting / visualisation
reporting = [
    "plotly>=5.0.0",
]
# ONNX Runtime inference
onnx = [
    "onnxruntime>=1.16.0",
]
# TensorFlow inference
tensorflow = [
    "tensorflow>=2.15.0",
]
# JAX inference
jax = [
    "jax>=0.4.20",
]
# Install all supported integrations
all = [
    "trustbench[torch,storage,api,reporting,onnx]",
]

[project.scripts]
trustbench = "trustbench.cli.main:app"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",

    # Dependencies required by the test suite
    "fastapi>=0.100.0",
    "sqlalchemy>=2.0.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "pymdown-extensions>=10.7",
]

[tool.ruff.lint]
ignore = ["B008"]

