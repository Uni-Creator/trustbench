[project]
name = "trustbench"
version = "0.2.0"
description = "TrustBench: Evaluation framework for ML model reliability, robustness, and uncertainty."
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Uni-Creator", email = "abhayr24564@gmail.com" }
]
requires-python = ">=3.11"
keywords = [
    "machine-learning",
    "evaluation",
    "reliability",
    "robustness",
    "uncertainty",
    "calibration",
    "ood-detection",
    "fairness",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Base dependencies: always installed
dependencies = [
    "numpy>=2.4.6",
    "scipy>=1.16.0",
    "scikit-learn>=1.9.1",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "pyyaml>=6.0",
    "click>=8.1.0",
    "jinja2>=3.1.6",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
# PyTorch inference
torch = [
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "pillow>=13.0.0",
]
pytorch = [
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "pillow>=13.0.0",
]
# Storage / API backend
storage = [
    "sqlalchemy>=2.1.6",
    "fastapi>=0.161.1",
    "uvicorn[standard]>=0.54.0",
]
# Reporting / visualisation
reporting = [
    "plotly>=7.1.0",
    "jinja2>=3.1.6",
]
# Dashboard
dashboard = [
    "streamlit>=1.66.1",
]
# ONNX Runtime inference
onnx = [
    "onnxruntime>=1.16.0",
]
# TensorFlow inference
tensorflow = [
    "tensorflow>=2.15.0",
]
# JAX inference
jax = [
    "jax>=0.4.20",
]
# Install everything
all = [
    "trustbench[torch,storage,reporting,dashboard,onnx]",
]

[project.scripts]
trustbench = "trustbench.cli.main:app"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.ruff.lint]
ignore = ["B008"]

