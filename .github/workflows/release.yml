name: Release TrustBench

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-and-test:
    name: Test and build distributions
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked --python 3.12 --group dev

      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          with Path("pyproject.toml").open("rb") as file:
              project = tomllib.load(file)["project"]

          package_version = project["version"]
          tag_version = os.environ["RELEASE_TAG"].removeprefix("v")

          if package_version != tag_version:
              raise SystemExit(
                  f"Tag version {tag_version!r} does not match "
                  f"pyproject.toml version {package_version!r}"
              )

          print(f"Release version verified: {package_version}")
          PY

      - name: Run test suite
        run: uv run --no-sync pytest --tb=short -q

      - name: Run Ruff
        run: uv run --no-sync ruff check .

      - name: Build wheel and source distribution
        run: uv build

      - name: Validate distributions
        run: |
          uv tool run twine check dist/*

      - name: Upload release distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  create-github-release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      contents: write

    steps:
      - name: Download release distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/

      - name: Create GitHub release and attach distributions
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: TrustBench ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.whl
            dist/*.tar.gz

  publish-to-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs:
      - build-and-test
      - create-github-release

    permissions:
      id-token: write

    environment:
      name: pypi
      url: https://pypi.org/p/trustbench

    steps:
      - name: Download release distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/

      - name: Publish distributions using trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/