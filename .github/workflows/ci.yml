name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Code Quality (Ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python and dependencies
        run: |
          uv python install 3.11
          uv sync --locked --python 3.11 --group dev

      - name: Run Ruff
        run: uv run --no-sync ruff check src/ tests/

  typecheck:
    name: Type Checking (Mypy)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python and dependencies
        run: |
          uv python install 3.11
          uv sync --locked --python 3.11 --group dev

      - name: Run Mypy
        run: |
          uv run --no-sync mypy src/trustbench/core src/trustbench/reporting src/trustbench/metrics --ignore-missing-imports

  test:
    name: Test Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python and dependencies
        run: |
          uv python install ${{ matrix.python-version }}
          uv sync --locked --python ${{ matrix.python-version }} --group dev

      - name: Run Pytest
        run: uv run --no-sync pytest --tb=short -q

  build-and-verify:
    name: Package Build & Install Verification
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install 3.11

      - name: Build Wheel and Source Distribution
        run: uv build

      - name: Install Wheel in Isolated Environment
        run: |
          uv venv --python 3.11 /tmp/test-env
          uv pip install --python /tmp/test-env/bin/python dist/*.whl

      - name: Verify Installed CLI
        run: /tmp/test-env/bin/trustbench version